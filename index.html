<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#060913" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="AEROSTRIKE: OMEGA — High-octane 2D serverless P2P Capture The Flag multiplayer shooter with jetpacks and recoil physics."
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- iOS / Mobile PWA Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AEROSTRIKE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="AEROSTRIKE" />

    <title>AEROSTRIKE: OMEGA — 2D P2P Capture The Flag</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #060913;
        overscroll-behavior: none;
      }
      @keyframes aero-boot-reveal {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes aero-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#060913] text-slate-100 select-none m-0 p-0">
    <div id="root">
      <!-- Matches OS splash background cleanly; spinner fades in only if boot takes >220ms -->
      <div
        style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#060913;opacity:0;animation:aero-boot-reveal 0.2s ease-out 0.22s forwards;"
      >
        <div
          style="width:36px;height:36px;border-radius:9999px;border:2px solid rgba(34,211,238,0.2);border-top-color:#22d3ee;animation:aero-boot-spin 0.75s linear infinite;"
        ></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
