<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060913" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="AEROSTRIKE: OMEGA — High-octane 2D serverless P2P Capture The Flag multiplayer shooter with jetpacks and recoil physics." />

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- iOS / Mobile PWA Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AEROSTRIKE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="AEROSTRIKE" />

    <title>AEROSTRIKE: OMEGA — 2D P2P Capture The Flag</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #060913;
        overscroll-behavior: none;
      }
      @keyframes aero-boot-pulse {
        0%, 100% { opacity: 0.95; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(0.97); }
      }
      @keyframes aero-boot-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(220%); }
      }
    </style>
  </head>
  <body class="bg-[#060913] text-slate-100 select-none m-0 p-0">
    <div id="root">
      <!-- 0ms Native Boot Splash (automatically replaced when React mounts) -->
      <div
        style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%, #0d1f3d 0%, #060913 72%);color:#e2e8f0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;user-select:none;"
      >
        <img
          src="/icon.svg"
          alt="AEROSTRIKE"
          width="88"
          height="88"
          style="width:88px;height:88px;border-radius:20px;box-shadow:0 0 32px rgba(0,240,255,0.28);animation:aero-boot-pulse 1.8s ease-in-out infinite;"
        />
        <div style="text-align:center;">
          <div style="font-size:18px;font-weight:900;letter-spacing:0.18em;color:#ffffff;">
            AERO<span style="color:#22d3ee;">STRIKE</span>
          </div>
          <div style="font-size:10px;letter-spacing:0.28em;color:#67e8f9;opacity:0.75;margin-top:4px;">
            INITIALIZING ORBITAL HANGAR
          </div>
        </div>
        <div style="width:160px;height:3px;background:rgba(15,23,42,0.9);border-radius:999px;overflow:hidden;border:1px solid rgba(34,211,238,0.25);">
          <div style="width:45%;height:100%;background:linear-gradient(90deg,transparent,#22d3ee,transparent);animation:aero-boot-bar 1.1s linear infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
