<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a1835"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Tactical Grid Lines -->
  <path d="M64 256 H448 M256 64 V448" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8"/>

  <!-- Jetpack Exhaust Flames -->
  <path d="M210 320 Q200 420 220 440 Q225 380 230 320 Z" fill="#f59e0b" filter="url(#glow)"/>
  <path d="M282 320 Q292 420 292 440 Q287 380 282 320 Z" fill="#f59e0b" filter="url(#glow)"/>
  <path d="M216 330 Q210 390 220 410 Q223 370 226 330 Z" fill="#ef4444"/>
  <path d="M286 330 Q292 390 284 410 Q281 370 286 330 Z" fill="#ef4444"/>

  <!-- Jetpack Thruster Cylinders -->
  <rect x="190" y="190" width="40" height="130" rx="12" fill="#1e293b" stroke="#00f0ff" stroke-width="3"/>
  <rect x="282" y="190" width="40" height="130" rx="12" fill="#1e293b" stroke="#00f0ff" stroke-width="3"/>

  <!-- Soldier Body Core -->
  <circle cx="256" cy="240" r="85" fill="url(#neonCyan)" filter="url(#glow)"/>
  <circle cx="256" cy="240" r="80" fill="#0f172a" stroke="#00f0ff" stroke-width="5"/>

  <!-- Visor / Cyber Optics -->
  <ellipse cx="280" cy="225" rx="36" ry="18" fill="#00f0ff" filter="url(#glow)"/>
  <ellipse cx="282" cy="225" rx="30" ry="12" fill="#ffffff"/>

  <!-- Tactical Helmet Rim -->
  <path d="M182 225 C182 145 330 145 330 225" fill="#1e293b" stroke="#38bdf8" stroke-width="6"/>

  <!-- Crosshair Accents -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="16 16"/>
  <path d="M256 70 V100 M256 412 V442 M70 256 H100 M412 256 H442" stroke="#00f0ff" stroke-width="4"/>

  <!-- Flag Emblem Top Right -->
  <polygon points="370,110 440,140 370,170" fill="url(#neonRed)" filter="url(#glow)"/>
  <line x1="370" y1="100" x2="370" y2="200" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</svg>
